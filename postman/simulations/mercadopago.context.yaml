assumptions:
  - id: seller-oauth-and-marketplace-fee
    status: supported
    claim: Payments API marketplace integration uses seller OAuth access tokens and application_fee for the marketplace commission.
    reason: Provider documentation specifies this request contract; simulation validates the caller sends the expected fee and exercises OAuth exchange.
    verification: On 2026-10-31 the six MercadoPagoSimulationTest scenarios passed against a Postman HTTP simulation; no real seller account was used.
    source: https://www.mercadopago.com.br/developers/pt/docs/checkout-api-payments/how-tos/integrate-marketplace; backend/src/test/java/br/com/pethub/MercadoPagoSimulationTest.java
    updated_at: '2026-10-31'
  - id: idempotent-create-retry
    status: supported
    claim: The caller reuses the same idempotency key and unchanged financial request after a simulated lost response following creation.
    reason: The mock records a charge then returns 503; the second real HTTP request reuses the key and recovers one charge in the modeled provider state.
    verification: ambiguousCreateFailureReusesTheSameKeyAndNeverDoubleCharges and cancellingAfterAmbiguousCreateStillFindsAndRefundsOriginalCharge passed on 2026-10-31. This establishes caller behavior, not the real provider retention window.
    source: backend/src/test/java/br/com/pethub/MercadoPagoSimulationTest.java; postman/mocks/mercadopago/default.js
    updated_at: '2026-10-31'
  - id: idempotency-retention-window
    status: unknown
    claim: The real provider retains the integration's idempotency records throughout every potential recovery interval.
    reason: A passing local simulation cannot establish production retention policy. The worker conservatively stops blind create retries after 23 hours and requires manual reconciliation.
    verification: No real account or long-duration production experiment was available; merchant/provider homologation remains required.
    source: backend/src/main/java/br/com/pethub/PaymentWorker.java
    updated_at: '2026-10-31'
  - id: financial-release-and-fees
    status: unknown
    claim: Seller accounts can release a net 90 percent on D+7 or D+1 under the user's commercial agreement.
    reason: Marketplace fees and release dates depend on Mercado Pago conditions. The implementation distinguishes internal forecasts from providerReleaseDate and does not invent bank transfers.
    verification: Only parsing of a modeled release date was exercised; production settlement, anticipation and processing fees require a real agreement.
    source: backend/README.md; https://www.mercadopago.com.br/developers/pt/docs/checkout-api-payments/how-tos/integrate-marketplace
    updated_at: '2026-10-31'

