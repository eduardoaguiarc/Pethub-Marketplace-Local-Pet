# Simulation scaffold. Add fault-injection scenarios under each mock, e.g.:
#   scenarios:
#     - overrides:
#         conditions:
#           latency: { delay_ms: 500 }
# Then serve it with: postman simulation run <this file>

simulation: mercadopago
routing: path
mocks:
  - name: mercadopago
    routeKey: mercadopago
    origin:
      - api.mercadopago.com
    path: postman/mocks/mercadopago
