$kind: http-request
name: ready
method: POST
url: '{{baseUrl}}/api/v1/merchant/orders/{{orderId}}/ready'
order: 14000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{merchantToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
