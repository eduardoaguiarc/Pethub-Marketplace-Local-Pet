$kind: http-request
name: register-merchant
method: POST
url: '{{baseUrl}}/api/v1/auth/register'
order: 4000
headers:
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Smoke merchant",
      "email": "merchant-{{runId}}@test.invalid",
      "password": "SmokeTestPassword123!",
      "role": "LOJISTA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.variables.set('merchantToken', pm.response.json().accessToken);
      pm.test('password hidden', () => pm.expect(pm.response.json().user).not.to.have.property('passwordHash'));
